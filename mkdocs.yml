site_name: Tsai UI
site_description: Public documentation for the Tsai Flutter UI library.
site_url: https://tsaitechnology.github.io/tsai-ui-flutter/
repo_url: https://github.com/tsaitechnology/tsai-ui-flutter
repo_name: tsaitechnology/tsai-ui-flutter
copyright: Copyright &copy; 2026 Tsai

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Use dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Use light theme

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Installation: installation.md
  - Theming: theming.md
  - Widgets:
      - Overview: widgets/index.md
      - Common:
          - TsaiBadge: widgets/tsai-badge.md
          - TsaiBadgeCounter: widgets/tsai-badge-counter.md
          - TsaiBadgeDot: widgets/tsai-badge-dot.md
          - TsaiChip: widgets/tsai-chip.md
          - TsaiButton: widgets/tsai-button.md
          - TsaiIconButton: widgets/tsai-icon-button.md
          - TsaiLink: widgets/tsai-link.md
      - Icons:
          - TsaiIcon: widgets/tsai-icon.md
          - HitIcon: widgets/hit-icon.md
          - CircleIcon: widgets/circle-icon.md
          - TsaiCryptoIcon: widgets/tsai-crypto-icon.md
      - Avatars:
          - Avatar: widgets/avatar.md
          - UserPill: widgets/user-pill.md
      - Typography:
          - TsaiTitle: widgets/tsai-title.md
          - TsaiTextHeading: widgets/tsai-text-heading.md
          - TsaiTextBody: widgets/tsai-text-body.md
          - TsaiTextButton: widgets/tsai-text-button.md
          - TsaiTextCaption: widgets/tsai-text-caption.md
          - TsaiTextMonoHeading: widgets/tsai-text-mono-heading.md
          - TsaiTextMonoBody: widgets/tsai-text-mono-body.md
          - TsaiTextMonoCaption: widgets/tsai-text-mono-caption.md
      - Forms:
          - TsaiInput: widgets/tsai-input.md
          - TsaiSearchInput: widgets/tsai-search-input.md
          - TsaiPhoneInput: widgets/tsai-phone-input.md
          - TsaiOtpInput: widgets/tsai-otp-input.md
          - TsaiPinInput: widgets/tsai-pin-input.md
          - TsaiSelect: widgets/tsai-select.md
          - TsaiNumericKeypad: widgets/tsai-numeric-keypad.md
          - TsaiSlider: widgets/tsai-slider.md
          - TsaiStepper: widgets/tsai-stepper.md
          - TsaiCheckbox: widgets/tsai-checkbox.md
          - TsaiRadio: widgets/tsai-radio.md
          - TsaiSwitch: widgets/tsai-switch.md
      - UI Blocks:
          - Section, empty state, and lists: widgets/tsai-ui-blocks.md
          - TsaiGlow: widgets/tsai-glow.md
          - TsaiToast: widgets/tsai-toast.md
          - TsaiInlineAlert: widgets/tsai-inline-alert.md
          - TsaiProgressBar and TsaiSpinner: widgets/tsai-progress.md
          - Tsai Skeleton: widgets/tsai-skeleton.md
          - TsaiCard: widgets/tsai-card.md
          - TsaiActionTile: widgets/tsai-action-tile.md
          - TsaiBankCard: widgets/tsai-bank-card.md
          - TsaiAmountDisplay: widgets/tsai-amount-display.md
      - Layout:
          - TsaiTabs: widgets/tsai-tabs.md
          - BottomNavBar: widgets/tsai-bottom-nav-bar.md
          - TsaiBottomSheet: widgets/tsai-bottom-sheet.md
          - TsaiModalDialog: widgets/tsai-modal-dialog.md
          - Tsai top bars: widgets/tsai-top-bars.md
          - TsaiPageIndicator: widgets/tsai-page-indicator.md
          - TsaiDivider: widgets/tsai-divider.md
          - TsaiAccordion: widgets/tsai-accordion.md
          - TsaiMiniTabs: widgets/tsai-mini-tabs.md
          - TsaiLineChart: widgets/tsai-line-chart.md
          - TsaiBarChart: widgets/tsai-bar-chart.md
  - License: license.md

strict: true
